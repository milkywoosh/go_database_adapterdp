basePath: /api/v1
definitions:
  api.CreateUserRequest:
    properties:
      email:
        type: string
      firstname:
        type: string
      lastname:
        type: string
      password:
        minLength: 6
        type: string
      username:
        type: string
    required:
    - email
    - firstname
    - lastname
    - password
    - username
    type: object
  api.CreateUserTxResult:
    properties:
      email:
        type: string
      firstname:
        type: string
      lastname:
        type: string
      username:
        type: string
    type: object
  api.ErrorResponse:
    properties:
      code:
        example: 400
        type: integer
      error:
        example: invalid request body
        type: string
    type: object
externalDocs:
  description: OpenAPI
  url: https://swagger.io/resources/open-api/
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: This is a sample server celler server.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Swagger LukeAul API
  version: "1.0"
paths:
  /purchase/createTx:
    post:
      consumes:
      - application/json
      description: Create a new Purchase for detail
      parameters:
      - description: purchase ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a new Purchase
      tags:
      - purchase
  /users/createTx:
    post:
      consumes:
      - application/json
      description: Creating New User which never existed before
      parameters:
      - description: request for creating new user
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.CreateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: reponse if success creating new user
          schema:
            $ref: '#/definitions/api.CreateUserTxResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Create New User of App
      tags:
      - users
securityDefinitions:
  BasicAuth:
    type: basic
swagger: "2.0"
